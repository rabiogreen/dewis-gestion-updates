function maybeCloseCopa(){ensureCopa();let now=new Date().toISOString().slice(0,10);for(let y=2026;y<Number(now.slice(0,4));y++){if(!db.copaHistory[y]){db.copaHistory[y]={closedAt:now,ranking:rankYear(String(y))};localStorage.setItem(KEY,JSON.stringify(db))}}}
function copaRanking(year){ensureCopa();return db.copaHistory[year]?.ranking||rankYear(year)}
function renderCopa(){maybeCloseCopa();let now=new Date().toISOString().slice(0,10);let years=[...new Set(['2026',String(new Date().getFullYear()),...Object.keys(db.copaHistory)])].sort().reverse();if(!years.includes(copaYear))copaYear=years[0];let locked=!!db.copaHistory[copaYear];let r=copaRanking(copaYear);return `<h2>Club Dewis y Copa Dewis</h2><div class="card"><h3>Temporada</h3><select onchange="copaYear=this.value;render()">${years.map(y=>`<option value="${y}" ${y===copaYear?'selected':''}>Copa ${y}</option>`).join('')}</select><p class="muted">${locked?'Clasificación final congelada el '+esc(db.copaHistory[copaYear].closedAt):'Puntos acumulados del 01/01 al 31/12/'+copaYear+'. Se congela al comenzar el año siguiente.'}</p>${locked?`<label><input style="width:auto" type="checkbox" ${db.copaHidden[copaYear]?'checked':''} onchange="ensureCopa();db.copaHidden[copaYear]=this.checked;save()"> Ocultar resultados de ${copaYear}</label>`:''}<p class="muted">El saldo de fidelización de cada cliente continúa entre temporadas. Los canjes no descuentan puntos de Copa ya ganados.</p></div>${locked&&db.copaHidden[copaYear]?'<div class="notice">Los resultados históricos están ocultos. Podés volver a mostrarlos cuando quieras.</div>':`<div class="card"><h3>${locked?'Resultados finales':'Clasificación actual'} · Copa ${copaYear}</h3>${r.map(x=>`<div class="line"><div><b>${x.rank}. ${esc(x.name)}</b><div class="muted">Saldo disponible: ${balance(x.id)} pts</div></div><div><b>${x.points} pts</b><br><button class="secondary" onclick="openPoint('${x.id}')">Puntos</button></div></div>`).join('')||'<p class="muted">Todavía no hay puntos para esta temporada.</p>'}</div>`}<div class="card"><h3>Movimientos de puntos</h3><p class="muted">Seleccioná un cliente para corregir, acreditar o canjear puntos.</p><button onclick="go('clientes')">Ver clientes</button></div>`}
function requestUpdateCheck(){let p=$('#update-status');if(p)p.textContent='Buscando actualización…';if(window.AndroidBridge&&typeof AndroidBridge.checkUpdates==='function'){try{AndroidBridge.checkUpdates()}catch(e){if(p)p.textContent='No se pudo consultar: '+e.message}}else if(p)p.textContent='La búsqueda manual requiere la APK con actualizador. La comprobación automática sigue activa.'}
function editPoint(pid){let p=db.points.find(x=>x.id===pid);if(!p)return;show(`<h2>Editar movimiento de puntos</h2><p class="muted">${esc(name(p.clientId))}</p><form onsubmit="savePointEdit(event,'${pid}')">${field('Puntos (+ o −)','amount',p.amount,'number',true)}${field('Fecha','date',p.date,'date',true)}${field('Motivo','notes',p.notes||'', 'text',true)}<label><input type="checkbox" style="width:auto" name="copaEligible" ${p.copaEligible===false?'':'checked'}> Cuenta para Copa (solo acreditaciones positivas)</label><footer><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Guardar cambios</button></footer></form><button class="danger" onclick="deletePoint('${pid}')">Anular movimiento</button>`)}
function savePointEdit(e,pid){e.preventDefault();let p=db.points.find(x=>x.id===pid),v=formData(e.target);if(!p)return;p.amount=Number(v.amount);p.date=v.date;p.notes=v.notes;p.copaEligible=v.copaEligible==='on';closeModal();save()}
function deletePoint(pid){if(!confirm('¿Anular este movimiento de puntos? Esta acción no puede deshacerse.'))return;db.points=db.points.filter(p=>p.id!==pid);closeModal();save()}
function viewClient(cid){let c=db.clients.find(x=>x.id===cid);if(!c)return;let sessions=db.sessions.filter(s=>s.clientId===cid);show(`<h2>${esc(clientDisplayName(c.name))}</h2><p class="muted">${esc(c.phone||'Sin teléfono')} · ${esc(c.email||'')}<br>Cumpleaños: ${esc(c.birthday||'Sin registrar')}</p><p>${esc(c.notes||'Sin observaciones')}</p><div class="metric"><small>Saldo Club Dewis</small><strong>${balance(cid)} puntos</strong></div><h3>Historial de sesiones</h3>${sessions.map(s=>`<div class="line"><div>${esc(s.date)} · ${esc(s.service)}<br><b>${money(s.amount)}</b></div><button class="secondary" onclick="editSession('${s.id}')">Editar</button></div>`).join('')||'<p class="muted">No hay sesiones cargadas.</p>'}<h3>Movimientos de puntos</h3>${db.points.filter(p=>p.clientId===cid).map(p=>`<div class="line"><div class="muted">${esc(p.notes||'')} · ${esc(p.date)}<br><b>${Number(p.amount)>0?'+':''}${p.amount} pts</b></div><button class="secondary" onclick="editPoint('${p.id}')">Editar</button></div>`).join('')}<footer class="actions"><button onclick="openClient('${cid}')">Editar ficha</button><button onclick="openPoint('${cid}')">+ / − Puntos</button><button onclick="openSession('${cid}')">Registrar sesión</button><button class="secondary" onclick="closeModal()">Cerrar</button></footer>`)}
function editSession(sid){let s=db.sessions.find(x=>x.id===sid);if(!s)return;show(`<h2>Editar sesión</h2><p class="muted">${esc(name(s.clientId))}</p><form onsubmit="saveSessionEdit(event,'${sid}')">${field('Servicio','service',s.service,'text',true)}${field('Fecha','date',s.date,'date',true)}${field('Importe ($)','amount',s.amount,'number',true)}<p class="muted">Se actualizará el ingreso vinculado. Los puntos ya acreditados se mantienen hasta que los edites por separado.</p><footer><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Guardar</button></footer></form>`)}
function saveSessionEdit(e,sid){e.preventDefault();let s=db.sessions.find(x=>x.id===sid);if(!s)return;let v=formData(e.target);if(Number(v.amount)<0)return alert('El importe no puede ser negativo');Object.assign(s,{service:v.service,date:v.date,amount:Number(v.amount)});let m=db.movements.find(x=>x.sessionId===sid);if(m)Object.assign(m,{category:v.service,date:v.date,amount:Number(v.amount)});closeModal();save()}
function openPoint(cid){let c=db.clients.find(c=>c.id===cid);if(!c)return;show(`<h2>Puntos · ${esc(c.name)}</h2><p>Saldo actual: ${balance(cid)} pts</p><form onsubmit="savePoint(event,'${cid}')">${field('Puntos (+ acreditar / − canjear)','amount','','number',true)}${field('Fecha','date',new Date().toISOString().slice(0,10),'date',true)}${field('Motivo','notes','', 'text',true)}<label><input style="width:auto" type="checkbox" name="copaEligible" checked> Sumar acreditación positiva a la Copa</label><footer><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Registrar</button></footer></form>`)}
function savePoint(e,cid){e.preventDefault();let v=formData(e.target);if(!Number(v.amount))return alert('Ingresá un valor distinto de cero');db.points.push({id:id(),clientId:cid,amount:Number(v.amount),date:v.date,notes:v.notes,copaEligible:v.copaEligible==='on'});closeModal();save()}
function deleteAppointment(tid){if(!confirm('¿Eliminar este turno? Podés cambiarlo a Cancelado si querés conservar el registro.'))return;db.appointments=db.appointments.filter(t=>t.id!==tid);closeModal();save()}
// Permite eliminar turnos desde el editor existente sin alterar los demás campos.
const originalOpenAppointment=openAppointment;
openAppointment=function(tid){originalOpenAppointment(tid);if(tid){let form=$('#modal form');if(form){let b=document.createElement('button');b.type='button';b.className='danger';b.textContent='Eliminar turno';b.onclick=()=>deleteAppointment(tid);form.after(b)}}};
const originalAppointmentLine=appointmentLine;
appointmentLine=function(t){return originalAppointmentLine(t)};
// Los datos guardados en versiones anteriores permanecen intactos.
render();
</script><div id="updater" style="position:fixed;top:0;left:0;right:0;z-index:100;background:#fff8e8;border-bottom:2px solid #b18c53;padding:10px;display:none;text-align:center;font:14px system-ui;color:#322c27"><span id="updatetext">Actualización disponible</span> <button onclick="AndroidBridge.applyUpdate()" style="margin:4px">Actualizar ahora</button><button class="secondary" onclick="document.getElementById('updater').style.display='none'">Más tarde</button></div><script>function dewisUpdateAvailable(version){document.getElementById('updatetext').textContent='Dewis Gestión '+version+' disponible';document.getElementById('updater').style.display='block'}function dewisUpdateMessage(message){alert(message)}</script></body></html>
